
name: Build Bubble Blast Pro APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          mkdir project
          unzip -o "bubble blast pro (1).zip" -d project
          PROJECT_DIR=$(dirname "$(find project -name settings.gradle -type f | head -n 1)")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BubbleBlastPro-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
